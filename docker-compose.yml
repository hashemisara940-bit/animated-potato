services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kairo
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
    ports:
      - "5432:5432"
    volumes:
      - kairo_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - kairo_ollama:/root/.ollama
volumes:
  kairo_postgres:
  kairo_ollama:
